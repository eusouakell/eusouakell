name: Profile README visual contract

on:
  pull_request:
    paths:
      - README.md
      - AGENTS.md
      - scripts/profile_readme_guard.py
      - .github/workflows/profile-readme-guard.yml
  push:
    branches: [main]
    paths:
      - README.md
      - AGENTS.md
      - scripts/profile_readme_guard.py
      - .github/workflows/profile-readme-guard.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-profile-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
      - name: Verify badges, visual assets, compactness and project credits
        run: python3 scripts/profile_readme_guard.py
