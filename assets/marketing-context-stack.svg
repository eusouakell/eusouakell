<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc">
<title id="title">Marketing Context Stack</title>
<desc id="desc">Six-layer context engineering stack from business context through governance.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1">
    <stop stop-color="#211326"/>
    <stop offset="1" stop-color="#401a3d"/>
  </linearGradient>
  <linearGradient id="accent" x2="1">
    <stop stop-color="#ff617a"/>
    <stop offset="1" stop-color="#b79aff"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#120b17" flood-opacity=".35"/>
  </filter>
</defs>
<rect width="1280" height="500" rx="28" fill="url(#bg)"/>
<g opacity=".12" fill="none" stroke="#ffb1c0">
  <circle cx="1170" cy="80" r="150"/><circle cx="1170" cy="80" r="110"/><circle cx="1170" cy="80" r="70"/>
</g>
<g font-family="Arial, Helvetica, sans-serif">
  <text x="64" y="64" fill="#fff7f4" font-size="30" font-weight="700">Marketing Context Stack</text>
  <text x="64" y="94" fill="#e0d3e5" font-size="17">A working model for Context Engineering in marketing and knowledge work</text>
</g>
<g filter="url(#shadow)" font-family="Arial, Helvetica, sans-serif">
  <rect x="64" y="128" width="1152" height="48" rx="12" fill="#5c294d"/>
  <text x="88" y="159" fill="#fff7f4" font-size="18" font-weight="700">6 · GOVERNANCE</text>
  <text x="332" y="159" fill="#efdde7" font-size="16">decisions · permissions · owners · human gates</text>

  <rect x="92" y="184" width="1096" height="48" rx="12" fill="#643054"/>
  <text x="116" y="215" fill="#fff7f4" font-size="18" font-weight="700">5 · EVALUATION</text>
  <text x="332" y="215" fill="#efdde7" font-size="16">checks · sensors · evals · evidence discipline</text>

  <rect x="120" y="240" width="1040" height="48" rx="12" fill="#6c365d"/>
  <text x="144" y="271" fill="#fff7f4" font-size="18" font-weight="700">4 · EXECUTION</text>
  <text x="332" y="271" fill="#efdde7" font-size="16">skills · agents · tools · MCP · deterministic utilities</text>

  <rect x="148" y="296" width="984" height="48" rx="12" fill="#744066"/>
  <text x="172" y="327" fill="#fff7f4" font-size="18" font-weight="700">3 · RUNTIME CONTEXT</text>
  <text x="418" y="327" fill="#efdde7" font-size="16">select · prioritize · compress · isolate · assemble · refresh</text>

  <rect x="176" y="352" width="928" height="48" rx="12" fill="#7b496f"/>
  <text x="200" y="383" fill="#fff7f4" font-size="18" font-weight="700">2 · KNOWLEDGE AUTHORITY</text>
  <text x="490" y="383" fill="#efdde7" font-size="16">specs · evidence · decisions · state</text>

  <rect x="204" y="408" width="872" height="48" rx="12" fill="url(#accent)"/>
  <text x="228" y="439" fill="#211326" font-size="18" font-weight="700">1 · BUSINESS CONTEXT</text>
  <text x="466" y="439" fill="#2b1531" font-size="16">brand · market · audience · offer · content · proof · GTM</text>
</g>
</svg>