<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-labelledby="title desc">
<title id="title">From research to applied evidence</title>
<desc id="desc">Four-step path from context engineering research to reference system, public validation and applied agent case.</desc>
<defs>
  <linearGradient id="bg2" x2="1">
    <stop stop-color="#fff7f4"/>
    <stop offset="1" stop-color="#f3edf6"/>
  </linearGradient>
  <linearGradient id="arrow" x2="1">
    <stop stop-color="#b63655"/>
    <stop offset="1" stop-color="#7047a3"/>
  </linearGradient>
</defs>
<rect width="1280" height="300" rx="24" fill="url(#bg2)"/>
<g font-family="Arial, Helvetica, sans-serif">
  <text x="64" y="56" fill="#211326" font-size="28" font-weight="700">From thesis to evidence</text>
  <text x="64" y="86" fill="#5d5262" font-size="16">Research → reference implementation → public validation → applied collaboration</text>

  <g>
    <rect x="64" y="124" width="246" height="112" rx="18" fill="#ffffff" stroke="#e7dbe9"/>
    <text x="84" y="154" fill="#b63655" font-size="14" font-weight="700">RESEARCH</text>
    <text x="84" y="184" fill="#211326" font-size="18" font-weight="700">Context Engineering</text>
    <text x="84" y="208" fill="#5d5262" font-size="15">principles · patterns · experiments</text>
  </g>

  <g>
    <rect x="354" y="124" width="246" height="112" rx="18" fill="#ffffff" stroke="#e7dbe9"/>
    <text x="374" y="154" fill="#7047a3" font-size="14" font-weight="700">REFERENCE SYSTEM</text>
    <text x="374" y="184" fill="#211326" font-size="18" font-weight="700">Marketing Context System</text>
    <text x="374" y="208" fill="#5d5262" font-size="15">router · provenance · evals</text>
  </g>

  <g>
    <rect x="644" y="124" width="246" height="112" rx="18" fill="#ffffff" stroke="#e7dbe9"/>
    <text x="664" y="154" fill="#b63655" font-size="14" font-weight="700">PUBLIC VALIDATION</text>
    <text x="664" y="184" fill="#211326" font-size="18" font-weight="700">Cereja Flamejante</text>
    <text x="664" y="208" fill="#5d5262" font-size="15">thesis graph · editorial engine</text>
  </g>

  <g>
    <rect x="934" y="124" width="282" height="112" rx="18" fill="#ffffff" stroke="#e7dbe9"/>
    <text x="954" y="154" fill="#7047a3" font-size="14" font-weight="700">APPLIED CASE</text>
    <text x="954" y="184" fill="#211326" font-size="18" font-weight="700">Bússola</text>
    <text x="954" y="208" fill="#5d5262" font-size="15">RAG · MCP · governed action</text>
  </g>

  <g stroke="url(#arrow)" stroke-width="3" fill="none">
    <path d="M318 180h28"/>
    <path d="M608 180h28"/>
    <path d="M898 180h28"/>
  </g>
  <g fill="#7047a3">
    <path d="M342 174l10 6-10 6z"/>
    <path d="M632 174l10 6-10 6z"/>
    <path d="M922 174l10 6-10 6z"/>
  </g>
</g>
</svg>